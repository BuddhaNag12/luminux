name: Luminux
options:
  bundleIdPrefix: com.buddhanag
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    DEVELOPMENT_TEAM: C3ZASV2S6N
    CODE_SIGN_STYLE: Automatic
packages:
  GoogleMobileAds:
    url: https://github.com/googleads/swift-package-manager-google-mobile-ads.git
    from: "13.0.0"
  GoogleUserMessagingPlatform:
    url: https://github.com/googleads/swift-package-manager-google-user-messaging-platform.git
    from: "3.0.0"
targets:
  Luminux:
    type: application
    platform: iOS
    sources:
      - path: Luminux
        # Local-testing products only; the scheme and the tests use it, the app never ships it.
        excludes: [Luminux.storekit]
      - path: Shared
    dependencies:
      - target: LuminuxWidget
      - package: GoogleMobileAds
      - package: GoogleUserMessagingPlatform
    postBuildScripts:
      - name: Check App Store IDs
        # Archives only (ACTION is "install"); simulator and phone test builds skip it.
        script: |
          if [ "$ACTION" != "install" ]; then exit 0; fi
          fail=0
          case "$SWIFT_ACTIVE_COMPILATION_CONDITIONS" in
            *PRO_FREE_FOR_TESTING*) echo "error: archives must be built without PRO_FREE_FOR_TESTING"; fail=1 ;;
          esac
          plist="$TARGET_BUILD_DIR/$INFOPLIST_PATH"
          read_key() { /usr/libexec/PlistBuddy -c "Print :$1" "$plist" 2>/dev/null; }
          for key in GADApplicationIdentifier LuminuxRewardedAdUnitID; do
            case "$(read_key $key)" in
              "") echo "error: $key is empty in project.yml"; fail=1 ;;
              *ca-app-pub-3940256099942544*) echo "error: $key is still Google's test ID in project.yml"; fail=1 ;;
            esac
          done
          exit $fail
        inputFiles:
          - $(TARGET_BUILD_DIR)/$(INFOPLIST_PATH)
        basedOnDependencyAnalysis: false
    entitlements:
      path: Luminux/Luminux.entitlements
      properties:
        com.apple.security.application-groups: [group.com.buddhanag.luminux]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.buddhanag.luminux
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: YES
    info:
      path: Luminux/Info.plist
      properties:
        CFBundleDisplayName: Luminux
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIAppFonts: [selawk.ttf, selawkl.ttf, selawksl.ttf, selawksb.ttf]
        NSPhotoLibraryUsageDescription: Luminux shows the photos and videos on this iPhone, organizes them into a journal, and lets you favorite and delete them. Your photos never leave your device.
        PHPhotoLibraryPreventAutomaticLimitedAccessAlert: true
        ITSAppUsesNonExemptEncryption: false
        # Lets animations run at 120 Hz on ProMotion screens.
        CADisableMinimumFrameDurationOnPhone: true
        CFBundleURLTypes:
          - CFBundleURLName: com.buddhanag.luminux
            CFBundleURLSchemes: [luminux]
        # The Luminux AdMob app and its ad units. Debug and test builds use Google's test units instead (AdConsent).
        GADApplicationIdentifier: ca-app-pub-7154730975495885~4556038621
        LuminuxRewardedAdUnitID: ca-app-pub-7154730975495885/4622478072
        # For the parked news panel.
        LuminuxNativeAdUnitID: ca-app-pub-7154730975495885/5809410542
        # The news proxy (Server/news-worker). Empty shows sample headlines in debug and test builds only.
        LuminuxNewsURL: ""
        # Google's list from developers.google.com/admob/ios/3p-skadnetworks; refresh it when Google adds buyers.
        SKAdNetworkItems:
          - SKAdNetworkIdentifier: cstr6suwn9.skadnetwork
          - SKAdNetworkIdentifier: 4fzdc2evr5.skadnetwork
          - SKAdNetworkIdentifier: 2fnua5tdw4.skadnetwork
          - SKAdNetworkIdentifier: ydx93a7ass.skadnetwork
          - SKAdNetworkIdentifier: p78axxw29g.skadnetwork
          - SKAdNetworkIdentifier: v72qych5uu.skadnetwork
